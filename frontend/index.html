<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GApangita? - Lost and Found</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="navbar__brand">
            <i class="fa-solid fa-box-open"></i>
            GApangita?</a>
        <div class="navbar__links">
            <a href="index.html" class="navbar__link">Home</a>
            <a href="report.html" class="navbar__link">Report Item</a>
            <a href="report.html" class="navbar__link">
                <i class="fa-solid fa-user-circle" style="margin-right: 8px;"></i>
            </a>
        </div>
    </nav>

    <div class="container">
        <header class="hero">
            <h1 class="hero__title">Lost Something? Found Something?</h1>
            <p>GApangita? helps you reunite with your lost belongings using smart fuzzy search technology.</p>
        </header>

        <section class="card">
            <div class="search-header">
                <div class="search-title-group">
                    <h2>Search Items</h2>
                </div>

                <div class="filter-pill">
                    <span class="filter-pill__track"></span>
                    <button class="filter-btn active">All</button>
                    <button class="filter-btn">Lost</button>
                    <button class="filter-btn">Found</button>
                </div>
            </div>

            <p class="helper-text">Use both filters to narrow down your results faster.</p>
    
            <div class="form-group">
                <h3>Item Name</h3>
                <input type="text" id="searchInput" class="form-input" placeholder="Type what you lost or found (e.g. 'black wallet', 'ID card')...">
            </div>
            
            <div class="form-group">
                <h3>Description Details</h3>
                <input type="text" id="searchDescInput" class="form-input" placeholder="Describe more details(color, brand location last seen, distinguishing marks)...">
            </div>

            <div class="filters-dropdown">

                <div class="filter-item">
                    <label for="category">Category</label>
                    <div class="select-wrapper">
                        <select id="category">
                            <option value="" disabled selected>Select a category...</option>
                            <option value="CAT0001">Electronics (Smartphones, Laptops, Tablets, etc.)</option>
                            <option value="CAT0002">Wallets & IDs (Purses, Credit Cards, etc.)</option>
                            <option value="CAT0003">Keys (House, Car, Keychains)</option>
                            <option value="CAT0004">Bags & Luggage (Backpacks, Handbags, etc.)</option>
                            <option value="CAT0005">Eyewear (Sunglasses, Prescription Glasses)</option>
                            <option value="CAT0006">Jewelry & Watches (Rings, Necklaces, etc.)</option>
                            <option value="CAT0007">Clothing (Jackets, Sweaters, Hats, etc.)</option>
                            <option value="CAT0008">Books & Stationery (Textbooks, Notebooks, etc.)</option>
                            <option value="CAT0009">Documents (Folders, Certificates, Files)</option>
                            <option value="CAT0010">Sports & Outdoors (Water Bottles, Gym Bags, etc.)</option>
                            <option value="CAT0011">Miscellaneous (Health & Beauty, Tools, Other)</option>
                        </select>
                    </div>
                </div>

                <div class="filter-item">
                    <label for="branch">School Branch</label>
                    <div class="select-wrapper">
                        <select id="branch">
                            <option value="" disabled selected>Select School Branch...</option>
                            <option value="BRH0001">UM Tagum Main</option>
                            <option value="BRH0002">UM Tagum Visayan</option>
                        </select>
                    </div>
                </div>

                <div class="filter-item">
                    <label for="location">Location</label>
                    <div class="select-wrapper">
                        <select id="location">
                            <option value="" selected>None / Don't know</option>
                            <option value="LOC0001">Academic Buildings (Lecture Halls, Classrooms)</option>
                            <option value="LOC0002">Laboratories (Computer, Science, Engineering)</option>
                            <option value="LOC0003">Libraries (Main Library, Study Rooms)</option>
                            <option value="LOC0004">Student Centers (Lounge, Organization Offices)</option>
                            <option value="LOC0005">Administrative Offices (Registrar, Finance)</option>
                            <option value="LOC0006">Cafeterias & Food Courts (Main Canteen, Kiosks)</option>
                            <option value="LOC0007">Sports & Athletics (Gymnasium, Open Courts)</option>
                            <option value="LOC0008">Religious Spaces (Campus Chapel, Prayer Rooms)</option>
                            <option value="LOC0009">Parking Areas (Student, Faculty, Drop-off)</option>
                            <option value="LOC0010">Outdoor Areas (Gazebos, Courtyards, Main Gate)</option>
                            <option value="LOC0011">Restrooms (Floor-specific, PWD Access)</option>
                        </select>
                    </div>
                </div>

            </div>

            <div id="resultsContainer" class="results-grid">
                <p>Start typing to search...</p>
            </div>
        </section>
    </div>

    <!-- Custom Modal System -->
    <div id="customModal" class="modal-overlay" style="display: none;">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="modalTitle">Notice</h3>
            </div>
            <div class="modal-body">
                <p id="modalMessage"></p>
            </div>
            <div class="modal-footer" id="modalFooter">
                <!-- Buttons will be injected here -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
