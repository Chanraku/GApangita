<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Item - GApangita?</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="navbar__brand">GApangita?</a>
        <div class="navbar__links">
            <a href="index.html" class="navbar__link">Home</a>
            <a href="report.html" class="navbar__link">Report Item</a>
        </div>
    </nav>

    <div class="container">
        <div class="grid-layout">
            <div class="card">
                <h2>Report an Item</h2>
                <p>Fill out the details below to report an item you have either lost or found.</p>
                <form id="reportForm">
                    <div class="form-group">
                        <label class="form-label" for="itemName">Item Name</label>
                        <input type="text" id="itemName" class="form-input" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="itemType">I have...</label>
                        <select id="itemType" class="form-select" required>
                            <option value="lost">Lost an item</option>
                            <option value="found">Found an item</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="categoryId">Category ID</label>
                        <input type="number" id="categoryId" class="form-input" placeholder="e.g. 1 (Electronics)" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="locationId">Location ID</label>
                        <input type="number" id="locationId" class="form-input" placeholder="e.g. 1 (Library)" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="reporterId">Your User ID</label>
                        <input type="number" id="reporterId" class="form-input" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="itemDescription">Description</label>
                        <textarea id="itemDescription" class="form-textarea" rows="4" placeholder="Provide distinct features..."></textarea>
                    </div>

                    <button type="submit" class="btn">Submit Report</button>
                    <p id="reportMessage" style="margin-top: 1rem; font-weight: bold;"></p>
                </form>
            </div>
            
            <div class="card" style="background-color: var(--color-accent); color: var(--color-primary);">
                <h2>Tips for Reporting</h2>
                <ul>
                    <li>Be as specific as possible in your description.</li>
                    <li>Mention unique markings, brands, or colors.</li>
                    <li>Ensure you select the correct category.</li>
                </ul>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
