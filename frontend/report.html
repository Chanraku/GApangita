<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Item - GApangita?</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="navbar__brand">
            <i class="fa-solid fa-box-open"></i>
            GApangita?</a>
        <div class="navbar__links">
            <a href="index.html" class="navbar__link">Home</a>
            <a href="report.html" class="navbar__link">Report Item</a>
            <a href="report.html" class="navbar__link">
                <i class="fa-solid fa-user-circle" style="margin-right: 8px;"></i>
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="grid-layout">
            <div class="card">
                <h2>Report an Item</h2>
                <p>Fill out the details below to report an item you have either lost or found.</p>
                <form id="reportForm">
                    <div class="form-group">
                        <label class="form-label" for="itemName">Item Name</label>
                        <input type="text" id="itemName" class="form-input" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="itemType">I have...</label>
                        <select id="itemType" class="form-select" required>
                            <option value="lost">Lost an item</option>
                            <option value="found">Found an item</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="categoryId">Category</label>
                        <select id="categoryId" class="form-select" required>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="branchId">School Branch</label>
                        <select id="branchId" class="form-select" required>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="locationId">Location</label>
                        <select id="locationId" class="form-select" required>
                            <option selected disabled>Select Branch first...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="itemDescription">Description</label>
                        <textarea id="itemDescription" class="form-textarea" rows="4" placeholder="Provide distinct features..." required></textarea>
                    </div>

                    <button type="submit" class="btn">Submit Report</button>
                </form>
            </div>
            
            <div class="card" style="background-color: var(--color-accent); color: var(--color-primary);">
                <h2>Tips for Reporting</h2>
                <ul>
                    <li>Be as specific as possible in your description.</li>
                    <li>Mention unique markings, brands, or colors.</li>
                    <li>Ensure you select the correct category.</li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Custom Modal System -->
    <div id="customModal" class="modal-overlay" style="display: none;">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="modalTitle">Notice</h3>
            </div>
            <div class="modal-body">
                <p id="modalMessage"></p>
            </div>
            <div class="modal-footer" id="modalFooter">
                <!-- Buttons will be injected here -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
